{% extends "ventes/base.html" %}
{% block content %}

<div class="product-detail-container">
    <div class="product-image-section">
        {% if product.image %}
            <img src="{{ product.image.url }}" alt="{{ product.nom }}" class="product-detail-image">
        {% endif %}
    </div>

    <div class="product-info-section">
        <h1 class="product-title">{{ product.nom }}</h1>
        <p class="product-price">{{ product.prix }} CDF</p>
        <p class="product-stock">Stock disponible : {{ product.stock }}</p>
        <p class="product-description">{{ product.description }}</p>

        <form action="{% url 'ajouter_au_panier' product.id %}" method="post" class="product-form">
            {% csrf_token %}
            {{ form.quantite }}
            <button type="submit" class="btn btn-primary">Ajouter au panier</button>
        </form>

        <a href="{% url 'liste_produits' %}" class="btn btn-secondary">Retour à la liste</a>
    </div>
</div>

{% endblock %}
