<h2>Salon de discussion</h2>

<div>
  {% for message in messages %}
    <p><strong>{{ message.expediteur.username }}:</strong> {{ message.contenu }} <small>{{ message.date_envoi }}</small></p>
  {% endfor %}
</div>

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Envoyer</button>
</form>
