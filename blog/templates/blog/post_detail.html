{% extends 'ventes/base.html' %}

{% block content %}
<div class="container mt-5">

    <div class="card shadow-sm border-0">
        {% if post.image %}
        <img src="{{ post.image.url }}" 
             alt="{{ post.titre }}" 
             class="card-img-top" 
             style="max-height: 400px; object-fit: cover;">
        {% endif %}

        <div class="card-body">
            <h2 class="card-title text-center">{{ post.titre }}</h2>
            <p class="text-muted text-center small">
                Publié par {{ post.auteur }} le {{ post.publie_le|date:"d M Y H:i" }}
            </p>

            <div class="mt-3">
                {{ post.contenu|linebreaks }}
            </div>

            <div class="text-center mt-4">
                <a href="{% url 'blog:post_list' %}" class="btn btn-secondary">← Retour au blog</a>
            </div>
        </div>
    </div>

</div>
{% endblock %}
